# ==============================================================
#  SCENARIO 2 - ADAPTIVE REROUTING
#  Two layered entities on the same road mesh:
#   - JunctionLoadProtocol: junctions diffuse queued vehicles onto
#     quieter neighbours (infrastructure-side rerouting)
#   - TripAgentDispatcher: individual trips route themselves hop
#     by hop using only locally observed occupancy (vehicle-side)
#  Coursework EME0650, use case #17 (Traffic Navigation).
# ==============================================================

random.seed 918273645
simulation.cycles 45
network.size 10000

protocol.view IdleProtocol

protocol.junction urbanflow.JunctionLoadProtocol
protocol.junction.linkable view
protocol.junction.capacity 120
protocol.junction.cap 0.75
protocol.junction.shift 4

control.reshuffle Shuffle

init.mesh WireWS
init.mesh.protocol view
init.mesh.k 8
init.mesh.beta 0.08

init.seed urbanflow.JunctionSeedInit
init.seed.protocol junction
init.seed.lo 12
init.seed.hi 114

include.init mesh seed

# trip agents: dispatch and advance individual vehicle trips
control.dispatch urbanflow.TripAgentDispatcher
control.dispatch.protocol junction
control.dispatch.dispatchRate 250
control.dispatch.hopBudget 14
control.dispatch.probeCount 4
control.dispatch.journeySpan 25
control.dispatch.avoidanceWeight 2.5

# infrastructure log: tick openCount fleetSize meanLoad peakLoad lockups overCapShare
control.meshlog urbanflow.JunctionStatsLogger
control.meshlog.protocol junction
control.meshlog.cap 0.75

# trip log: tick dispatched arrived stranded diverted divertShare avgHops
control.triplog urbanflow.TripStatsLogger
