# ==============================================================
#  SCENARIO 1 - FLOW SENSING
#  Epidemic (gossip) averaging discovers the city-wide mean road
#  occupancy without a central traffic desk.
#  Coursework EME0650, use case #17 (Traffic Navigation).
# ==============================================================

random.seed 918273645
simulation.cycles 45
network.size 10000

# mesh view: a Watts-Strogatz small world, mostly short local streets
# plus a handful of long-range shortcuts (motorway links)
protocol.view IdleProtocol

protocol.flow urbanflow.FlowGossipProtocol
protocol.flow.linkable view

control.reshuffle Shuffle

init.mesh WireWS
init.mesh.protocol view
init.mesh.k 8
init.mesh.beta 0.08

init.seed urbanflow.FlowSeedInit
init.seed.protocol flow
init.seed.lo 0.0
init.seed.hi 1.0

include.init mesh seed

# prints: tick lo hi live mean spread devi
control.log urbanflow.FlowStatsLogger
control.log.protocol flow
