# ==============================================================
#  SCENARIO 3 - DISRUPTION RESILIENCE
#  Same flow sensing as scenario 1, but every cycle a fraction of
#  junctions suffers a sudden disruption (accident, roadworks,
#  stalled vehicle) that overwrites its sensed reading with a
#  fresh, un-aggregated draw. Tests whether flow sensing still
#  tracks the true city-wide mean under constant disruption.
#  Coursework EME0650, use case #17 (Traffic Navigation).
# ==============================================================

random.seed 918273645
simulation.cycles 65
network.size 10000

protocol.view IdleProtocol

protocol.flow urbanflow.FlowGossipProtocol
protocol.flow.linkable view

control.reshuffle Shuffle

init.mesh WireWS
init.mesh.protocol view
init.mesh.k 8
init.mesh.beta 0.08

init.seed urbanflow.FlowSeedInit
init.seed.protocol flow
init.seed.lo 0.0
init.seed.hi 1.0

include.init mesh seed

# disruptions: overwrite 'disruptionRate' of junctions per cycle
# (override on the command line, e.g. control.disrupt.disruptionRate=0.10)
control.disrupt urbanflow.DisruptionInjector
control.disrupt.protocol flow
control.disrupt.disruptionRate 0.05
control.disrupt.lo 0.0
control.disrupt.hi 1.0

control.log urbanflow.FlowStatsLogger
control.log.protocol flow
